<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Depot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='orbit.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% set ep = request.endpoint or '' %}
  <div class="shell">
    <header class="band">
      <div class="band__inner">
        <a class="band__identity" href="{{ url_for('items_view') }}">Depot</a>
        <nav class="band__nav" aria-label="Primary">
          <ul>
            <li><a href="{{ url_for('items_view') }}"{% if ep.startswith('item') %} aria-current="page"{% endif %}>Items</a></li>
            <li><a href="{{ url_for('activity_view') }}"{% if ep.startswith('activity') %} aria-current="page"{% endif %}>Activity</a></li>
          </ul>
        </nav>
        <p class="band__status">Equipment lending register</p>
      </div>
    </header>

    <main data-view="{% block view %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>

    <footer class="folio">
      <p>{% block folio %}Depot{% endblock %}</p>
    </footer>
  </div>
</body>
</html>
