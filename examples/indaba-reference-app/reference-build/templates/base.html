<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Depot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="masthead">
    <div class="shell masthead-inner">
      <p class="identity">
        <span class="brand">Depot</span>
        <span class="descriptor">Equipment lending register</span>
      </p>
      {% set current = self.view() %}
      <nav aria-label="Primary">
        <ul>
          <li><a href="{{ url_for('items_view') }}"
                 {% if current in ['register', 'form', 'detail'] %}class="on" aria-current="page"{% endif %}>Items</a></li>
          <li><a href="{{ url_for('activity_view') }}"
                 {% if current == 'activity' %}class="on" aria-current="page"{% endif %}>Activity</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content" data-view="{% block view %}{% endblock %}">
    <div class="shell">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="foot">
    <div class="shell">
      <p>Depot — a community workshop register.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
